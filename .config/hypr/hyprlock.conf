shape {
    monitor =
    size = 1200, 800
    color = rgba(111112cc)

    position = 0, 25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 600, 85
    outline_thickness = 3
    inner_color = rgba(cccccc11)
    font_color = rgba(ccccccff)

    outer_color = rgba(ccccccaa) rgba(ccccccff) 45deg
    check_color = rgba(3333ccaa) rgba(3333ccff) 120deg
    fail_color = rgba(cc3333aa) rgba(cc3333ff) 40deg

    fade_on_empty = false
    rounding = 15

    position = 0, -150
    halign = center
    valign = center
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 1
    blur_size = 3
    vibrancy  = 0.1696
}

label {
    monitor =
    text = Hi, $DESC!
    font_size = 38
    color = rgba(ccccccff)

    position = 0, -25
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/user-icon.png
    size = 250
    rounding = -1
    border_size = 0

    position = 0, 175
    halign = center
    valign = center
}
